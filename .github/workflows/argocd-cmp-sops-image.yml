name: argocd-cmp-sops image

on:
  push:
    branches: [master]
    paths:
      - "images/argocd-cmp-sops/**"
      - ".github/workflows/argocd-cmp-sops-image.yml"
  pull_request:
    paths:
      - "images/argocd-cmp-sops/**"
      - ".github/workflows/argocd-cmp-sops-image.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: argocd-cmp-sops
  SOPS_VERSION: "3.13.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.SOPS_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/argocd-cmp-sops
          file: images/argocd-cmp-sops/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOPS_VERSION=${{ env.SOPS_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Anonymous cluster pulls need a public package (new GHCR packages default private).
          for attempt in 1 2 3 4 5; do
            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${IMAGE_NAME}/visibility" \
              -f visibility=public; then
              exit 0
            fi
            echo "visibility update failed (attempt ${attempt}); waiting for package index…"
            sleep 5
          done
          echo "::warning::Could not set package visibility to public; set it manually in GHCR settings."
